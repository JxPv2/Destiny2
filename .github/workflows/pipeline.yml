name: D2 Wishlist Pipeline

on:
  schedule:
    - cron: '0 */8 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        working-directory: ${{ github.workspace }}/dim_wishlists/spreadsheets_to_dim_wishlists
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        working-directory: ${{ github.workspace }}/dim_wishlists/spreadsheets_to_dim_wishlists
        run: python pipeline_launcher.py
        env:
          PYTHONIOENCODING: utf-8

      - name: Copy wishlists to repo-root dim_wishlists
        run: |
          mkdir -p ${{ github.workspace }}/dim_wishlists
          cp ${{ github.workspace }}/dim_wishlists/spreadsheets_to_dim_wishlists/dim_wishlists/*.txt ${{ github.workspace }}/dim_wishlists/ 2>/dev/null || true

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add dim_wishlists/
          git add dim_wishlists/spreadsheets_to_dim_wishlists/
          
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update wishlists [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
