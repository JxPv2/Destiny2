name: D2 Wishlist Pipeline

on:
  schedule:
    # Every 8 hours (UTC): 00:00, 08:00, 16:00
    - cron: '0 */8 * * *'
  workflow_dispatch:  # Allows manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Persist credentials so we can git-push later
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pipeline
        run: |
          cd ${{ github.workspace }}
          python pipeline_launcher.py
        env:
          # Optional: if you want to pass the Bungie API key as a secret
          # BUNGIE_API_KEY: ${{ secrets.BUNGIE_API_KEY }}
          PYTHONIOENCODING: utf-8

      - name: Commit and push wishlists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Stage only the output directories you care about
          git add dim_wishlists/
          git add logs/
          git add local_version_state.json
          
          # Only commit if there are changes
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-update wishlists [$(date -u +'%Y-%m-%d %H:%M:%S UTC')]"
            git push
          fi
