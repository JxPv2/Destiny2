# =============================================================================
# D2-Stuff Wishlist Splitter Configuration
# =============================================================================
#
# This config drives dim_wishlists_splitter.py, which reads a full wishlist .txt
# and its corresponding scraped JSON, then writes filtered (split) wishlists.
#
# Each output definition becomes one .txt file in dim_wishlists/splitted/.
#
# -----------------------------------------------------------------------------
# OUTPUT DEFINITION FIELDS
# -----------------------------------------------------------------------------
#
# Required:
#   id (str)
#       Unique identifier for this output. Used in log messages to identify
#       which output definition produced a given file or warning.
#
#   config_source_spreadsheet (str)
#       Which source to read. MUST match the filename prefix of the wishlist
#       and scraped JSON produced by earlier pipeline stages.
#       Example: "aegis_boss-damage" reads:
#         - aegis_boss-damage_spreadsheet_dim_wishlist.txt
#         - aegis_boss-damage_spreadsheet_data_scraped.json
#
# Optional file naming (pick exactly one strategy per output):
#   output_filename (str)
#       Hardcoded filename. Use this for complete control over the output name.
#       Example: "my_custom_name.txt"
#
#   output_filename_suffix (str)
#       Auto-derived from the original wishlist filename.
#       Example: suffix "top" on "aegis_boss-damage_spreadsheet_dim_wishlist.txt"
#       produces: "aegis_boss-damage_spreadsheet_dim_wishlist_top.txt"
#
#   (neither)
#       Falls back to {id}.txt
#
# Optional header overrides (independent for title and description):
#   wishlist_title (str)
#       Hardcoded title. Replaces the original completely.
#
#   wishlist_title_suffix (str)
#       Injected into the original title before "(updated ...)" if that pattern
#       exists; otherwise appended to the end.
#       Example: "Rank: 1-2" produces:
#       "Aegis' Boss Damage | Rank: 1-2 (updated 2026-03-12)"
#
#   wishlist_description (str)
#       Hardcoded description. Replaces the original completely.
#
#   wishlist_description_suffix (str)
#       Appended to the original description before "| Autogenerated by JxP".
#       If that pattern is absent, the suffix is appended to the end instead.
#       Example: "Rank 1-2" produces: "... | Rank 1-2 | Autogenerated by JxP"
#
# Optional rules (list, AND-combined):
#   rules (list[dict])
#       Filter rules. ALL rules must pass for a weapon to be included.
#       If omitted, every weapon from the source is included.
#
# -----------------------------------------------------------------------------
# RULE TYPES
# -----------------------------------------------------------------------------
#
# 1. WORKBOOK RULE
#    Filter by source workbook name (the tab name in the Google Sheet).
#
#    Fields:
#      type: "workbook"
#      include (str | list[str]) -> Only these workbooks (list recommended)
#      exclude (str | list[str]) -> Exclude these workbooks (list recommended)
#
#    You can use include, exclude, or both. Exclusion is checked FIRST.
#    If include is provided, the workbook MUST be in the list.
#
#    NOTE: While single strings are accepted, prefer lists for clarity:
#      include: ["Exotic Weapons"]   # GOOD
#      include: "Exotic Weapons"      # Works, but discouraged
#
# 2. FILTER RULE
#    Filter by a value in the scraped JSON record.
#
#    Fields:
#      type: "filter"
#      apply_to_workbook (str | list[str]) -> Only apply to this workbook(s)
#      apply_to_workbook: "*"               -> Apply to all workbooks
#      apply_to_workbook_group (str)       -> Lookup group in workbook_groups
#      apply_to_workbook_pattern (str)     -> Regex pattern for workbook names
#      scraped_field (str)                 -> Dot-notation path into JSON
#      values (list[str])                  -> Allowed values (string match)
#
#    If the field value is a list (e.g. perks.perk2), ANY list element
#    matching an allowed value counts as a pass.
#
#    If the field is missing from the record, the rule FAILS (rejects).
#    If you need to match "field is missing", there is no built-in sentinel;
#    ensure the scraper emits an empty string "" instead of omitting the key.
#
#    If workbook targeting is specified and doesn't match the weapon's source
#    workbook, the rule is SKIPPED (returns True) rather than failing.
#    This lets you chain per-workbook filters safely.
#
# -----------------------------------------------------------------------------
# WORKBOOK GROUPS
# -----------------------------------------------------------------------------
# workbook_groups lets you define reusable lists of workbook names that can be
# referenced by apply_to_workbook_group in filter rules. This avoids repeating
# long workbook lists across multiple output definitions.
# =============================================================================

workbook_groups:
  # Archetype workbooks: every weapon-type tab EXCEPT exotic tabs.
  archetypes:
    - "Autos"
    - "Bows"
    - "HCs"
    - "Pulses"
    - "Scouts"
    - "Sidearms"
    - "SMGs"
    - "BGLs"
    - "Fusions"
    - "Glaives"
    - "Shotguns"
    - "Snipers"
    - "Rocket Sidearms"
    - "Traces"
    - "HGLs"
    - "LFRs"
    - "LMGs"
    - "Rockets"
    - "Swords"
    - "Other"

  # All tabs that use the "tier" field (includes exotic tabs).
  use_tier:
    - "Autos"
    - "Bows"
    - "HCs"
    - "Pulses"
    - "Scouts"
    - "Sidearms"
    - "SMGs"
    - "BGLs"
    - "Fusions"
    - "Glaives"
    - "Shotguns"
    - "Snipers"
    - "Rocket Sidearms"
    - "Traces"
    - "HGLs"
    - "LFRs"
    - "LMGs"
    - "Rockets"
    - "Swords"
    - "Other"
    - "Exotic Weapons"
    - "Exotic Armor (ignore)"

# =============================================================================
# OUTPUT DEFINITIONS
# =============================================================================

outputs:

  # ---------------------------------------------------------------------------
  # AEGIS' BOSS DAMAGE
  # ---------------------------------------------------------------------------
  # Source: aegis_boss-damage spreadsheet
  # Keep only weapons ranked "Meta-Defining" or "Situational".
  # ---------------------------------------------------------------------------
  - id: aegis_boss-damage_rank_1-2
    config_source_spreadsheet: aegis_boss-damage
    output_filename_suffix: "rank_1-2"
    wishlist_title_suffix: "Rank: 1-2"
    wishlist_description_suffix: ""
    rules:
      - type: filter
        apply_to_workbook: "*"
        scraped_field: info.rank
        values: ["Meta-Defining", "Situational"]

  # ---------------------------------------------------------------------------
  # AEGIS' SPEEDRUNNER
  # ---------------------------------------------------------------------------
  # Source: aegis_speedrunner spreadsheet
  # Keep only weapons with the top two speedrunner ranks.
  # ---------------------------------------------------------------------------
  - id: aegis_speedrunner_rank_1-2
    config_source_spreadsheet: aegis_speedrunner
    output_filename_suffix: "rank_1-2"
    wishlist_title_suffix: "Rank: 1-2"
    wishlist_description_suffix: ""
    rules:
      - type: filter
        apply_to_workbook: "*"
        scraped_field: info.rank
        values: ["Best in Role, Must-Have", "Alternate Inferior Pick, Niche"]

  # ---------------------------------------------------------------------------
  # AEGIS' ENDGAME — Tier S-A (all tabs)
  # ---------------------------------------------------------------------------
  # Source: aegis_endgame spreadsheet
  # Shopping List uses numeric ranks (1, 2); all other tabs use letter tiers.
  # We combine two filter rules:
  #   1. For "Shopping List": keep ranks 1 and 2.
  #   2. For all tier-using tabs: keep tiers S and A.
  # The empty string "" in the second rule's values is INTENTIONAL: some
  # weapons may have an empty tier field that should still pass. If a weapon
  # has NO tier field at all (null/None in JSON), the rule will REJECT it.
  # ---------------------------------------------------------------------------
  - id: aegis_endgame_tier_s-a
    config_source_spreadsheet: aegis_endgame
    output_filename_suffix: "tier_s-a"
    wishlist_title_suffix: "Tier: S-A"
    wishlist_description_suffix: ""
    rules:
      - type: filter
        apply_to_workbook: "Shopping List"
        scraped_field: info.rank
        values: ["1", "2"]
      - type: filter
        apply_to_workbook_group: "use_tier"
        scraped_field: info.tier
        values: ["S", "A", ""]

  # ---------------------------------------------------------------------------
  # AEGIS' ENDGAME — Tier S-A (NO exotic tabs)
  # ---------------------------------------------------------------------------
  # Same tier logic as above, but explicitly excludes the two exotic tabs
  # BEFORE applying the tier filters.
  # ---------------------------------------------------------------------------
  - id: aegis_endgame_tier_s-a_no_exotic_tabs
    config_source_spreadsheet: aegis_endgame
    output_filename_suffix: "tier_s-a_no_exotic_tabs"
    wishlist_title_suffix: "Tier: S-A (No Exotic Tabs)"
    wishlist_description_suffix: ""
    rules:
      - type: workbook
        exclude: ["Exotic Weapons", "Exotic Armor (ignore)"]
      - type: filter
        apply_to_workbook: "Shopping List"
        scraped_field: info.rank
        values: ["1", "2"]
      - type: filter
        apply_to_workbook_group: "archetypes"
        scraped_field: info.tier
        values: ["S", "A", ""]

  # ---------------------------------------------------------------------------
  # AEGIS' ENDGAME — Exotic Weapons only
  # ---------------------------------------------------------------------------
  # Isolate the "Exotic Weapons" workbook and keep only S-tier and A-tier.
  # ---------------------------------------------------------------------------
  - id: aegis_endgame_tier_s-a_exotic_weapons
    config_source_spreadsheet: aegis_endgame
    output_filename_suffix: "tier_s-a_exotic_weapons"
    wishlist_title_suffix: "Tier: S-A (Exotic Weapons)"
    wishlist_description_suffix: ""
    rules:
      - type: workbook
        include: ["Exotic Weapons"]
      - type: filter
        apply_to_workbook: "Exotic Weapons"
        scraped_field: info.tier
        values: ["S", "A"]

  # ---------------------------------------------------------------------------
  # AEGIS' ENDGAME — Exotic Armor only
  # ---------------------------------------------------------------------------
  # Isolate the "Exotic Armor (ignore)" workbook.
  # Armor tiers may be empty strings, so we match "" explicitly.
  # NOTE: If the armor has NO tier field at all, this rule will REJECT it.
  # ---------------------------------------------------------------------------
  - id: aegis_endgame_tier_s-a_exotic_armors
    config_source_spreadsheet: aegis_endgame
    output_filename_suffix: "tier_s-a_exotic_armors"
    wishlist_title_suffix: "Tier: S-A (Exotic Armors)"
    wishlist_description_suffix: ""
    rules:
      - type: workbook
        include: ["Exotic Armor (ignore)"]
      - type: filter
        apply_to_workbook: "Exotic Armor (ignore)"
        scraped_field: info.tier
        values: [""]

