# ==============================================================================
# SECTION 3: MANIFEST BYPASS LIST
# ==============================================================================
# Some items have broken/incomplete perk pools in Bungie's manifest.
# This forces wishlist generation without pool validation.
# (exotic class items for example) (looking at you bungo)
# Add items name.
# ==============================================================================
ignore_manifest_perk_pool:
  - "Relativism"
  - "Stoicism"
  - "Solipsism"
  - "Ergo Sum"

# ==============================================================================
# SECTION 3.5: RANK TRANSLATION TABLES
# ==============================================================================
# Community spreadsheets use numeric or symbolic ranks that need to be
# translated into human-readable strings for DIM wishlist notes.
# Each mapping is keyed by the spreadsheet logical name.
# ==============================================================================

rank_mappings:
  # --------------------------------------------------------------------------
  # Aegis' Boss Damage — numeric 1-4
  # --------------------------------------------------------------------------
  aegis_boss-damage:
    "1": "Meta-Defining"
    "2": "Situational"
    "3": "Extremely Niche"
    "4": "Not Meta, Worse Alternative"

  # --------------------------------------------------------------------------
  # Aegis' Speedrunner — numeric 1-3 + N/A
  # --------------------------------------------------------------------------
  aegis_speedrunner:
    "1": "Best in Role, Must-Have"
    "2": "Alternate Inferior Pick, Niche"
    "3": "Situational, Unnecessary"
    "N/A": "Not Relevant"

  # --------------------------------------------------------------------------
  # Aegis' Endgame — Exotic tier symbols
  # --------------------------------------------------------------------------
  aegis_endgame_exotic:
    "✔": "Optimal"
    "▲": "Viable"
    "!": "Situational"
    "✖": "Wasted"

  # --------------------------------------------------------------------------
  # Aegis' Endgame — Exotic type symbols
  # --------------------------------------------------------------------------
  aegis_endgame_exotic_type:
    "N": "Neutral"
    "S": "Swap"
    "H": "Hybrid"
    "M": "Movement"

# ==============================================================================
# SECTION 4: MANIFEST FILTERS
# ==============================================================================
# When compiling the manifest, skip these plug categories.
# This shrinks the processed manifest and removes non-perk sockets
# (shaders, trackers, masterworks, armor mods, etc.).
# Each string is matched with .startswith() against the plugCategoryIdentifier.
# "itemTypeDisplayName"
# ==============================================================================
bungie_manifest_filtering:
  ignored_plug_categories:
    - "shader"                                        # Shaders
    - "mementos"                                      # Mementos
    - "skins"                                         # Ornaments
    - "v400.plugs.weapons.masterworks.trackers"       # Kills Trackers
    - "crafting.plugs.weapons.mods.memories"          # Deepsight Resonance
    - "crafting.plugs.weapons.mods.transfusers.level" # Crafted Weapon Levels
    - "crafting.plugs.weapons.mods.extractors"        # Extract Pattern
    - "v300.weapon.damage_type.energy"                # Energy Mods
    - "v400.weapon.mod_damage"                        # Weapon Mods
    - "v400.weapon.mod_guns"                          # Weapon Mods
    - "v400.plugs.weapons.masterworks"                # All Weapon Masterwork
    - "enhancements.v2"                               # Armor Mods
    - "v460.plugs.armor.masterworks.stat."            # Armor Upgrade
    - "enhancements.artifice"                         # Armor Artifice