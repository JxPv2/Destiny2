# ==============================================================================
# PIPELINE CONFIGURATION
# ==============================================================================
# This single file controls the entire pipeline:
#   - Where files are stored
#   - Which Bungie manifest components to download
#   - Which Google Sheets to scrape
#   - Which perk categories to ignore
# ==============================================================================

# ==============================================================================
# SECTION 0: GLOBAL PIPELINE PATH MANIFEST
# ==============================================================================
# All paths are relative to where the script runs from (repo root).
# These folders are created automatically if they don't exist.
# ==============================================================================
pipeline_paths:
  state_file: "local_version_state.json"      # Tracks versions/hashes so we know what changed
  log_dir: "logs"                            # One .log file per script
  manifest_dir: "bungie_manifest_data"         # Raw + compiled Bungie manifest JSON
  download_dir: "workbooks_downloaded"         # CSV/XLSX files from Google Sheets
  scraped_dir: "spreadsheets_scraped_data"    # Cleaned JSON after scraping
  wishlist_dir: "dim_wishlists"              # Final .txt files DIM can import
  
# ==============================================================================
# SECTION 1: BUNGIE API
# ==============================================================================
# The Bungie API key is optional for manifest metadata (it works without one).
# If you register at https://www.bungie.net/developer you get higher rate limits.
# ==============================================================================
bungie_api:
  api_key: "Destiny2API"                     # Placeholder — replace with real key or leave as-is
  components:                                # Which manifest tables to download
    - DestinyInventoryItemDefinition          # Weapons, perks, armor, everything
    - DestinyPlugSetDefinition                # Random-roll perk pools per weapon
    
# ==============================================================================
# SECTION 2: GOOGLE SHEETS TO MONITOR
# ==============================================================================
# ------------------------------------------------------------------------------
# spreadsheets  –  A dictionary of spreadsheets you want to track.
# ------------------------------------------------------------------------------
# Each key (e.g. 'creator_spreadsheet-name') is a short, unique name used
# throughout the pipeline.
#
# Each value is another dictionary:
#   name       - The name that will be used into the wishlist.txt files.
#
#   id         – The Google Sheets file ID.  It is the long string in the
#                sheet’s URL: https://docs.google.com/spreadsheets/d/<ID>/edit
#
#   tags       - They will be added as | tags: at the end of the wishlist.
#                Used to be searchable keywords in DIM (wishlistnotes:).
#
#   workbooks  – A list of the exact spreadsheet (tab) gids and names you want to extract.
#
#   gid        - The workbook ID. It is the long string in the
#                sheet’s URL: https://docs.google.com/spreadsheets/d/<ID>/edit?gid=<GID>
#   name       - Must match the workbook name in the Spreadsheet.
#                Used as fallback if GID is not working.
#
#   tags       - Same as tags for the spreadsheet. If you declare in the workbook they
#                will get priority over the spreadsheet ones.
#                (use example: spreadsheets is mostly pve but this workbook is pvp).
#
#   use_xlsx   - True to tell the extractor scripts to actually use the xlsx version of 
#                the workbooks to be able to read particular formatted workbooks.
# ==============================================================================
spreadsheets:
  # --------------------------------------------------------------------------
  # Spreadsheet: Aegis' Boss Damage
  # --------------------------------------------------------------------------
  aegis_boss-damage:
